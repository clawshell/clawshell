services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    image: openclaw
    container_name: openclaw-gateway
    command: ["gateway","run","--bind","lan","--port","18789"]
    ports:
      - "18789:18789"
    environment:
      UID: $UID
      GID: $GID
      USER: app
    volumes:
      - config-openclaw:/home/app/.openclaw
    restart: unless-stopped

  clawshell:
    build:
      context: .
      dockerfile: Dockerfile
    image: clawshell
    container_name: clawshell
    depends_on:
      - openclaw-gateway
    command: ["start", "--config", "/etc/clawshell/clawshell.toml", "--foreground"]
    environment:
      CLAWSHELL_SERVER_HOST: "0.0.0.0"
      CLAWSHELL_OAUTH_CALLBACK_HOST: "0.0.0.0"
      UID: $UID
      GID: $GID
      USER: app
    ports:
      - "18790:18790"
      - "51121:51121"
    volumes:
      - config-clawshell:/etc/clawshell
    restart: unless-stopped

volumes:
  config-openclaw:
  config-clawshell:
